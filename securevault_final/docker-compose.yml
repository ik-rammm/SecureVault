services:
  # ── Flask backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./securevault
      dockerfile: Dockerfile
    container_name: securevault-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - vault_data:/app/data
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production_32chars_min}
      - JWT_SECRET=${JWT_SECRET:-change_me_jwt_secret_32chars_minimum}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-securevault_redis_pass}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - securevault-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # ── Redis (rate limiting & JWT blacklist) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: securevault-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-securevault_redis_pass} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - securevault-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-securevault_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Nginx reverse proxy (HTTP — add HTTPS in production with real certs) ───
  nginx:
    image: nginx:alpine
    container_name: securevault-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - securevault-net

volumes:
  vault_data:
    driver: local
  redis_data:
    driver: local

networks:
  securevault-net:
    driver: bridge
